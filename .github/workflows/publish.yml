name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (all, snarl, imouto, aether)"
        required: true
        type: choice
        options:
          - all
          - snarl
          - imouto
          - aether
        default: "all"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  discover:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      packages: ${{ steps.packages.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Discover workspace packages
        id: packages
        run: |
          chmod +x ./scripts/discover-packages.ts
          echo "list<<EOF" >> $GITHUB_OUTPUT
          ./scripts/discover-packages.ts >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  publish:
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover.outputs.packages) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        if: |
          github.event_name == 'push' ||
          github.event.inputs.package == 'all' ||
          matrix.package.name == github.event.inputs.package ||
          endsWith(matrix.package.name, format('/{0}', github.event.inputs.package))
        with:
          deno-version: v2.x

      - name: Publish ${{ matrix.package.name }}
        if: |
          github.event_name == 'push' ||
          github.event.inputs.package == 'all' ||
          matrix.package.name == github.event.inputs.package ||
          endsWith(matrix.package.name, format('/{0}', github.event.inputs.package))
        working-directory: ${{ matrix.package.path }}
        run: deno publish
